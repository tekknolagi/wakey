<!DOCTYPE html>
<meta charset="utf-8">
<div id="myplot"></div>
<script src="/d3.min.js"></script>
<script src="/plot.min.js"></script>
<script type="module">
  const data_raw = await d3.json("/cgi-bin/air.cgi");
  const data = data_raw.map(function(d) { return {...d, date: d3.timeParse("%s")(d.timestamp) }; });
  const plot = Plot.plot({
    y: {
      grid: true,
      label: "CO2 (ppm)"
    },
    x: {
      label: "Date",
    },
    marks: [
      Plot.line(data, Plot.windowY(14, {x: "date", y: "CO2", stroke: "#4e79a7"})),
      Plot.ruleY([400, 800, 1000])  // outside, uh oh, v bad
    ]
  });
  const div = document.querySelector("#myplot");
  div.append(plot);
</script>
